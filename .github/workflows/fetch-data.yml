name: Auto-fetch football data + generate analysis

on:
  schedule:
    # Runs every day at 06:00 UTC (9am Ethiopia time)
    - cron: '0 6 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to push data file updates back to repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fixtures, results, standings from ESPN
        run: python ethiopredict/scripts/fetch_data.py

      - name: Generate AI match analysis (requires GEMINI_API_KEY secret)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ethiopredict/scripts/generate_analysis.py

      - name: Post predictions to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python ethiopredict/scripts/post_to_telegram.py

      - name: Commit and push if data changed
        run: |
          git config user.name "EthioPredict Bot"
          git config user.email "bot@ethiopredict.vercel.app"
          git add ethiopredict/src/data/
          git diff --staged --quiet || (git commit -m "data: auto-update fixtures, results, standings + AI analysis [skip ci]" && git pull --rebase origin main && git push)
