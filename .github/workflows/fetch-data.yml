name: Auto-fetch football data

on:
  schedule:
    # Runs every day at 06:00 UTC (9am Ethiopia time)
    - cron: '0 6 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch data from ESPN API
        run: python ethiopredict/scripts/fetch_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "EthioPredict Bot"
          git config user.email "bot@ethiopredict.vercel.app"
          git add ethiopredict/src/data/matches.ts ethiopredict/src/data/results.ts ethiopredict/src/data/standings.ts
          git diff --staged --quiet || git commit -m "data: auto-update fixtures, results, standings [skip ci]"
          git push
